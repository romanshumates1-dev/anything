<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — DealFlow AI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="offline">
      <div class="card">
        <div class="icon">⚡</div>
        <h1>You're offline</h1>
        <p class="subtitle">
          DealFlow AI can't reach the server right now. Check your internet
          connection — we'll reconnect automatically as soon as you're back.
        </p>
        <div class="actions" style="justify-content: center;">
          <button id="retry" class="primary">Try Again</button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </main>

    <script src="./offline.js"></script>
  </body>
</html>
