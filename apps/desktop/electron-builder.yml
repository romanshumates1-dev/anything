appId: ai.dealflow.desktop
productName: DealFlow AI
copyright: Copyright © 2026 DealFlow AI

# Only ship what the packaged app actually needs.
# Yarn Berry PnP mode cannot vend electron to electron-builder, so we
# declare the version explicitly for the packager to download.
electronVersion: 33.3.0

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
  - "!scripts/**/*"
  - "!src/**/*"
  - "!tsconfig.json"
  - "!electron-builder.yml"

# Ensure a clean output on every packaging run.
removePackageScripts: true
asar: true

# Disable code signing on Windows for non-admin environments
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/icon.ico
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  # Skip code signing when running without admin privileges
  verifyUpdateCodeSignature: false
  sign: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DealFlow AI
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

# ---------------------------- macOS ----------------------------------------
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------- Linux ----------------------------------------
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: assets/icon.png
  category: Office
  maintainer: DealFlow AI <support@dealflow.ai>
  synopsis: DealFlow AI desktop client
  artifactName: ${productName}-${version}-${arch}.${ext}

# Protocol registration for deep links (dealflow://...)
protocols:
  - name: DealFlow AI Protocol
    schemes:
      - dealflow