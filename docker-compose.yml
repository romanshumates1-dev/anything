# DealFlow AI — local/prod-like container stack.
#
# Services:
#   app     — the Next.js web server (from the multi-stage Dockerfile)
#   worker  — the always-on job drainer (scripts/worker.mjs, same image)
#   ollama  — OPTIONAL local LLM, only in the `ollama` profile
#
# DATABASE: the app uses @neondatabase/serverless (HTTP/WS), which does NOT
# speak the vanilla Postgres wire protocol. So DATABASE_URL must point at Neon
# (cloud) — set it in .env. A `postgres:16-alpine` service is intentionally NOT
# included as the app's primary DB because the neon serverless driver cannot
# talk to it without Neon's local wsproxy; running one here would be a ghost
# dependency. For a fully-local DB, add the neon proxy in a follow-up (see
# DEPLOY.md "fully-local Postgres" note).
#
# Profiles: `dev` (default) and `prod`. Bring up: `docker compose up`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dealflow-ai:latest
    env_file: .env
    environment:
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/system/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles: ["dev", "prod"]

  worker:
    image: dealflow-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/web/scripts/worker.mjs"]
    env_file: .env
    environment:
      APP_URL: http://app:4000
      JOB_POLL_INTERVAL_MS: "3000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["dev", "prod"]

  # Optional local LLM for AI_PROVIDER=ollama testing. `docker compose --profile ollama up`.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    profiles: ["ollama"]

volumes:
  ollama_models:
