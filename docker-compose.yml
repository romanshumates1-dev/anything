# DealFlow AI — Self-Hosted Production Stack
#
# Zero-Cost Self-Hosting:
#   AI:     Ollama (local, free)
#   Email:  Gmail SMTP (500/day free) or AWS SES (~$0.10/1000)
#   SMS:    AWS SNS (~$0.00645/msg)
#   Social: Free (Instagram/Facebook/TikTok/Twitter APIs)
#   DB:     Neon free tier (0.5GB, 190 compute hrs/mo)
#
# Usage:
#   docker compose up -d           # Start app + worker + ollama
#   docker compose logs -f         # View logs
#   docker compose down            # Stop all
#
# The app uses @neondatabase/serverless (HTTP/WS) so DATABASE_URL must point
# to Neon cloud. Set all env vars in apps/web/.env before starting.

services:
  # Main Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dealflow-ai:latest
    env_file: apps/web/.env
    environment:
      PORT: 4000
      NODE_ENV: production
      # Use the local ollama container
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # Background job worker (drains job queue every 3 seconds)
  worker:
    image: dealflow-ai:latest
    command: ["node", "apps/web/scripts/worker.mjs"]
    env_file: apps/web/.env
    environment:
      APP_URL: http://app:4000
      JOB_POLL_INTERVAL_MS: "3000"
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Local Ollama for FREE AI (no API costs)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Auto-pull the model on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:7b && wait"]

volumes:
  ollama_models:
