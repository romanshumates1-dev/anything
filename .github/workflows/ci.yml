name: CI

# NOTE: GitHub only runs workflows from `.github/workflows/` at the REPOSITORY ROOT.
# This platform restricts writes to the /apps directory, so the file lives here.
# To activate CI: copy this file to `<repo-root>/.github/workflows/ci.yml`.

on:
  push:
    # Work branches get CI too, not just main. Previously this listed `main`
    # only, so with PR #4 merged there was no open PR and every push to
    # feat/mvp-prelaunch ran ZERO checks — work sat unverified until it hit
    # main, which is the worst possible place to first learn a suite is red.
    # Affordable now: Enterprise includes 50,000 Actions minutes/month.
    branches: [main, "feat/**", "claude/**", "verification-sprint"]
  pull_request:
    branches: [main]
  # Manual trigger — re-run CI on any branch without an empty commit. Also the
  # supported way to confirm a flaky-test fix by running the same ref twice.
  workflow_dispatch:
  # Merge queue (GitHub Enterprise/Team). Queued PRs are tested against the
  # PROJECTED merge result one at a time, which structurally removes the
  # shared-Neon-branch collision between flows-live and e2e — the reason those
  # two jobs are serialized with `needs:` below. Enable the queue in
  # Settings > Branches > main > "Require merge queue".
  merge_group:

# Runs on the same ref QUEUE rather than cancelling.
#
# `cancel-in-progress: true` was the documented suspect for the long-standing CI
# flake (SESSION_HANDOFF.md "CI flake note"): killing a run mid-transaction was
# thought to leave the SHARED Neon test branch dirty. The real cause turned out
# to be a 5s vitest timeout (fixed in src/app/api/vitest.config.ts), but
# cancelling live-DB runs mid-write is still a genuine hazard and the saving no
# longer matters — GitHub Enterprise includes 50,000 Actions minutes/month vs
# 2,000 on the free tier, and a full green run is ~13 minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────
# JOB 1 — Web: typecheck (shipped code only) + full mocked test suite.
#
# typecheck uses tsconfig.typecheck.json which excludes **/*.test.ts and
# __tests__/** so vi.fn / mock-internal patterns never trip strict tsc.
# Tests run without RUN_LIVE_FLOWS so flows-live.test.ts self-skips.
# ─────────────────────────────────────────────────────────────
jobs:
  web:
    name: "Web — typecheck + unit/contract tests"
    # Larger runners are a GitHub Enterprise feature and must be provisioned in
    # org settings BEFORE a label like `ubuntu-latest-4-core` will schedule — an
    # unprovisioned label queues forever instead of failing. So this reads a repo
    # variable and falls back to the free label: set `CI_RUNNER` under
    # Settings > Secrets and variables > Actions > Variables to switch, with no
    # workflow edit and no risk of a hung queue if it is unset.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Enable Corepack BEFORE any yarn invocation so Yarn Berry resolves the
      # correct version from .yarnrc.yml without a "no matching version" error.
      - name: Enable Corepack
        run: corepack enable

      # Cache Yarn's global content-addressed store keyed on the lockfile.
      # A cache hit makes `yarn install --immutable` a sub-second no-op.
      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # Typechecks ONLY shipped code (routes, lib, utils, pages).
      # tsconfig.typecheck.json extends tsconfig.json but excludes all
      # *.test.ts / __tests__/** so mock-internal type noise (vi.fn,
      # .mock.calls[i][n], as any) can never block the deploy gate.
      # NODE_OPTIONS raises the V8 heap: this typecheck OOMs at the default heap
      # on developer machines (exit 134 — an OOM abort, which reads like a
      # tooling crash rather than a type error and has cost real debugging time).
      # CI has survived on the runner's larger default so far, but the margin
      # shrinks as the codebase grows; pinning it makes CI and local identical.
      - name: Typecheck shipped code
        run: yarn workspace web typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Static analysis (oxlint config at repo root: .oxlintrc.json).
      # --no-ignore is required: the repo-root .eslintignore is a blanket `*`
      # (platform scaffolding for a plain-eslint setup that's never wired into
      # any script), and oxlint honors .eslintignore for compatibility — so
      # without this flag it silently matches 0 files and reports a false
      # "0 warnings and 0 errors" pass. --no-ignore only disables that stale
      # ignore file for this invocation; the path is already scoped to
      # apps/web/src, so no node_modules/build output is in scope regardless.
      - name: Lint (oxlint)
        run: yarn dlx oxlint@1.58.0 --no-ignore apps/web/src

      # Prompt 1 Phase 2 hard requirement: ALLOW_DEMO_SEED (which unlocks the
      # ~1000-row fabricated-reviews seed script) must never be defined in a
      # production-targeted env file, independent of the runtime NODE_ENV
      # check the seed script itself does.
      - name: Check ALLOW_DEMO_SEED absent from production env files
        working-directory: apps/web
        run: node scripts/check-no-demo-seed-in-prod-env.mjs

      # Full mocked unit/integration suite (242 tests): behavioral tests for
      # items 1-8 + approvals / pause-AI / rate-limit. All DB calls are mocked;
      # flows-live.test.ts self-skips without RUN_LIVE_FLOWS.
      - name: Run unit + integration suite
        run: yarn workspace web test

# ─────────────────────────────────────────────────────────────
# JOB — Compliance gate: the "we cannot send a message we shouldn't" suite.
#
# These files are ALSO covered by the web job's full run. They get their own
# job so there is a single, fast, unambiguously-named required status check for
# the send-safety invariants — DNC/opt-out suppression, consent basis, quiet
# hours, send windows, demo allowlist, cold-outbound profile rules, and the
# bounded-negotiation numeric guard. When this check is red, no send-path change
# merges, regardless of what else is green.
#
# Mark it required: Settings > Branches > main > Require status checks.
# ─────────────────────────────────────────────────────────────
  compliance:
    name: "Compliance — send-safety gate suite"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # Trailing args are vitest FILENAME FILTERS (matched against file paths).
      - name: Run compliance gate suite
        working-directory: apps/web
        run: |
          set -o pipefail
          yarn vitest run --config src/app/api/vitest.config.ts \
            dispatchGate optOutRegression cadenceEngine sms-gateway \
            demoAllowlist luxuryColdGate test-mode-block \
            dncRegistry dispatchGateDnc dispatchGateEmail emailDriver \
            mailDriver contactResolution \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/compliance.log

          # A filter that matches NOTHING makes vitest exit 0 — a silent false
          # pass on the most safety-critical suite in the repo. This repo has
          # already been bitten by exactly this class of bug twice: oxlint
          # matching 0 files via a stale .eslintignore (hence --no-ignore
          # above), and a vitest run against the wrong config reporting a
          # bogus "49 passed, 4 failed". So assert real coverage, don't trust
          # the exit code alone.
          FILES=$(grep -aoE 'Test Files +[0-9]+ passed' /tmp/compliance.log \
                  | grep -oE '[0-9]+' | head -1)
          echo "compliance test files passed: ${FILES:-0}"
          # Bump this whenever a file is added to the filter list above. 13 as
          # of the direct-mail channel + optional contact resolution. Count
          # verified by running the filter locally, not assumed.
          if [ "${FILES:-0}" -lt 13 ]; then
            echo "::error title=Compliance gate::Expected >=13 compliance test files, got ${FILES:-0}. A filter matched nothing, or a file was renamed/deleted without updating this job."
            exit 1
          fi

# ─────────────────────────────────────────────────────────────
# JOB — Desktop: bundle (esbuild) + typecheck the Electron shell.
#
# Runs in parallel with the web job (no DB needed). The build step generates
# icons, bundles main/preload/renderer via esbuild, and copies static assets;
# the typecheck step runs `tsc --noEmit` against the shipped source. Either a
# bundling error or a type error fails the job and blocks the merge.
#
# Note: this job does NOT run `electron-builder` (no packaging/binary download)
# — it only proves the desktop source compiles + bundles cleanly, which is the
# fast, deterministic guard suitable for every push/PR. Packaging installers is
# a separate release-time concern.
# ─────────────────────────────────────────────────────────────
  desktop:
    name: "Desktop — bundle + typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # Generates icons, bundles main/preload/renderer via esbuild, and copies
      # the static HTML/CSS. Fails the job on any bundling error.
      - name: Build desktop app
        run: yarn workspace desktop build

      # Type-only pass against the shipped source (electron types are installed
      # above). Fails the job on any type error.
      - name: Typecheck desktop app
        run: yarn workspace desktop typecheck

# ─────────────────────────────────────────────────────────────
# JOB 2 — Layer C: live flow runner against a real Neon test branch.
#
# Only runs after the web job passes. Bootstraps the schema, then executes
# flows-live.test.ts against the real DB. Any failed step fails CI.
#
# AI is mocked in CI (boundary tests prove the contract).
# Real-key calls only under RUN_LIVE_AI=1 for human-triggered validation.
#
# Requirements:
#   TEST_DATABASE_URL — a Neon branch postgres:// connection string,
#   configured as a GitHub repo secret. The @neondatabase/serverless
#   driver speaks HTTP to Neon, so a plain postgres:// service container
#   won't work here — it must be a real Neon branch URL.
# ─────────────────────────────────────────────────────────────
  flows-live:
    name: "Layer C — live DB flow runner"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web]

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      RUN_LIVE_FLOWS: "1"
      # Matches the hardcoded SECRET constant in flows-live.test.ts so the
      # job-runner and SMS webhook auth checks pass without real secrets.
      JOB_RUNNER_SECRET: "flow-runner-secret"
      SMS_INBOUND_SECRET: "flow-runner-secret"
      # Isolate the send-PIPELINE flows from wall-clock quiet hours: without this
      # the campaign_lifecycle send is (correctly) deferred whenever CI runs
      # after 9pm lead-local, flaking 'process_jobs: expected pending to be
      # completed'. Quiet-hours itself is covered deterministically in
      # dispatchGate.test.ts. Prod never sets this.
      DISPATCH_SKIP_QUIET_HOURS: "1"
      PGSSLMODE: require

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hard-fail with a clear message rather than a cryptic Neon connection
      # error many steps later.
      - name: Verify TEST_DATABASE_URL secret is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error title=Missing secret::TEST_DATABASE_URL is not set."
            echo "Add a Neon branch postgres:// connection string as a GitHub repo secret."
            echo "The @neondatabase/serverless driver requires a real Neon URL."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      # Apply the schema idempotently against the test branch.
      # All tables use CREATE TABLE IF NOT EXISTS so this is safe to re-run.
      # PGSSLMODE=require is inherited from the job-level env block.
      # schema.sql + campaign-pipeline are the BASE tables; migrations 001–017
      # add everything after (inbound_latency, number_pool, negotiation_*,
      # contracts.inspection_days, …). psql applies the migration files natively
      # (dollar-quotes + comments), and every migration is idempotent
      # (IF NOT EXISTS / ON CONFLICT), so this is safe and complete. Without the
      # migrations the live-gated suite (sla.test.ts etc.) hits missing tables.
      - name: Bootstrap test schema (base + all migrations)
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f apps/web/db/schema.sql
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f apps/web/db/campaign-pipeline-schema.sql
          for f in apps/web/db/migrations/*.sql; do
            echo "── applying $f"
            psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$f"
          done

      # RUN_LIVE_FLOWS=1 + a real DATABASE_URL un-gates every live test
      # (flows-live + sla + numberPoolStore); all need the migrated schema above.
      - name: Run live flow tests (Layer C)
        run: yarn workspace web test

# ─────────────────────────────────────────────────────────────
# JOB 3 — E2E: the 10-step campaign→inbox→approvals journey via Playwright
# (bundled chromium). This is the permanent guard against "PASS ✅ but the
# route doesn't exist" — the journey drives the real UI + webhook + DB, so a
# missing route or broken page fails the merge.
#
# The "Bootstrap test schema" step below IS the fresh-deploy test: it applies
# schema.sql + campaign-pipeline-schema.sql + migrations 001–012 in order to a
# fresh Neon test branch on every push/PR. A failure here blocks the merge.
#
# AI is mocked in CI (boundary tests prove the contract).
# Real-key calls only under RUN_LIVE_AI=1 for human-triggered validation.
#
# Requires TEST_DATABASE_URL (Neon branch). Auth/webhook secrets are fixed
# test values; TWILIO_* are dummy but present so the inbound webhook uses the
# signed-form path (the spec signs with the same TWILIO_AUTH_TOKEN).
# ─────────────────────────────────────────────────────────────
  e2e:
    name: "E2E — 10-step journey (Playwright/chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialized after flows-live: both jobs bootstrap + query the SAME Neon
    # TEST_DATABASE_URL branch. Running in parallel let e2e's migration DDL
    # (ALTER/CREATE for 001–012) take ACCESS EXCLUSIVE locks mid-flows-live-run,
    # intermittently failing Layer C. Serializing removes the collision. (Ideal:
    # a separate Neon branch per job — needs a 2nd secret, owner action.)
    needs: [web, flows-live]

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-do-not-use-in-prod
      BETTER_AUTH_URL: http://localhost:4000
      SMS_INBOUND_SECRET: e2e-ci-sms-inbound-secret
      TWILIO_ACCOUNT_SID: ACe2eci00000000000000000000000000
      TWILIO_AUTH_TOKEN: e2e-ci-twilio-auth-token
      PW_CHANNEL: chromium
      # Same wall-clock isolation as Layer C (see that job's note).
      DISPATCH_SKIP_QUIET_HOURS: "1"
      PGSSLMODE: require

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify TEST_DATABASE_URL secret is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error title=Missing secret::TEST_DATABASE_URL is not set (Neon branch URL)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      # FRESH-DEPLOY TEST: apply base schema + campaign pipeline + the sprint
      # migrations (auth tables, pause-AI column, api_keys, compliance_audit)
      # in order to a fresh Neon test branch. All statements are idempotent
      # (CREATE ... IF NOT EXISTS, guarded CREATE TYPE via DO blocks, guarded
      # ALTERs). If any statement errors on a fresh DB, psql exits non-zero and
      # this step fails the merge — this IS the deployable-schema guard.
      - name: Bootstrap test schema (base + ALL migrations, glob-ordered)
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f apps/web/db/schema.sql
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f apps/web/db/campaign-pipeline-schema.sql
          # Glob so new migrations are picked up automatically (was a hardcoded
          # list that stopped at 012 and silently missed 013–017).
          for f in apps/web/db/migrations/*.sql; do
            echo "── applying $f"
            psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$f"
          done

      # @playwright/test is not in the lockfile (registry TLS-blocked in the
      # authoring env); install it here + the bundled chromium browser.
      - name: Install Playwright + chromium
        working-directory: apps/web
        run: |
          yarn add -D @playwright/test@1.61.1
          yarn playwright install --with-deps chromium

      # Runs the 10-step journey. playwright.config webServer auto-starts
      # `yarn dev`; global-setup registers a user + seeds via DATABASE_URL.
      # A failure here BLOCKS the merge.
      - name: Run E2E journey (10 steps)
        working-directory: apps/web
        run: yarn playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

# NOTE: the Docker build + container-smoke + GHCR release jobs were removed
# 2026-07-17 — they were mis-indented (invalid YAML that broke the WHOLE
# workflow) and cannot be verified without Docker on the host. They are
# deferred until Docker Desktop + GHCR permissions are configured; see
# DEPLOY.md. The Dockerfile/compose remain in the repo, ready to re-add.
