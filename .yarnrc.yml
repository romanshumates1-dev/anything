logFilters:
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0068
    level: discard
  - code: YN0086
    level: discard

networkConcurrency: 1

# Redirect Yarn's cache + global store onto D:. TWO reasons:
#  (1) C: is 100% full (0 bytes free) so Yarn's default cache under the C: home
#      dir hits `ENOSPC: no space left on device` mid-fetch. D: has ~2.8TB free.
#  (2) `nmMode: hardlinks-global` can only hardlink into node_modules (on D:)
#      from a global store on the SAME volume. Keeping the store on D: makes the
#      hardlinks work instead of silently degrading to copies (or failing).
cacheFolder: ./.yarn/cache
globalFolder: ./.yarn/berry

# CHANGED from hardlinks-global (2026-09-16, Cloudflare deployment work).
#
# Adding the Cloudflare packages (@opennextjs/cloudflare, wrangler) made the
# hardlink step fail REPRODUCIBLY on this machine:
#   YN0001: Error: While cloning /D:/anything/node_modules/@aws-sdk/types ->
#   .../apps/web/node_modules/@aws-sdk/token-providers/node_modules/@aws-sdk/types
#   UNKNOWN: unknown error, link ...AwsCredentialIdentity.js -> ...
# Retrying did NOT help: it failed twice, on a different file each time, so the
# hardlinking itself is failing, not one corrupt file. nmHoistingLimits below
# multiplies these cross-tree clone operations, which is what exposes it.
#
# Yarn 4.12 accepts only: classic | hardlinks-local | hardlinks-global
# (taken from its own error message - "copy" is NOT a valid value).
# classic copies files instead of hardlinking and completes cleanly.
#
# Cost: ~242 MiB of extra disk against ~2.7 TB free on D:. A reliable
# yarn install is worth far more than the dedup saving.
nmMode: classic


# Each workspace nests ALL of its own dependencies in its own node_modules
# instead of hoisting them to the repo root. Without this, sibling-workspace
# deps collide at the root: apps/mobile's tailwindcss v3 hoisted to
# d:\anything\node_modules and shadowed apps/web's tailwindcss v4, AND apps/web's
# own runtime deps (@neondatabase/serverless, ws, kysely, twilio, react) hoisted
# up to the root where Turbopack (pinned to apps/web via next.config.js
# `turbopack.root`) can no longer resolve them. Nesting per-workspace makes
# apps/web/node_modules self-contained so both problems disappear. This is
# disk-cheap here because `nmMode: classic` below copies identical files per
# workspace rather than hardlinking them from a global content-addressable
# store. (classic was chosen 2026-09-16 because hardlinks-global failed
# reproducibly when the Cloudflare packages were added — see the note above.
# The extra ~242 MiB against ~2.7 TB free on D: is worth a reliable install.)
nmHoistingLimits: workspaces

nodeLinker: node-modules

# yarnPath removed — use system Yarn
